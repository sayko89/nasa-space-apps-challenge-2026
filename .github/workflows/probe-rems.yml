name: Probe REMS archive (structure only)

# One-off: saves the REMS MODRDR format file, directory listings and one sample table to
# pipeline/sources/_probe/rems/ so the climatology builder can be written against the real
# layout. atmos.nmsu.edu is not reachable from the development sandbox.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-rems.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          set -x
          D=pipeline/sources/_probe/rems; mkdir -p $D
          B=https://atmos.nmsu.edu/PDS/data
          get() { curl -sSL --retry 3 --max-time 120 -A "martian-map data pipeline" -o "$2" "$1" || echo "FAILED $1" >> $D/errors.txt; }
          get $B/ $D/list_root.html
          for v in mslrem_1001 mslrem_0001; do
            get $B/$v/ $D/list_${v}.html
            get $B/$v/DATA/ $D/list_${v}_DATA.html
            get $B/$v/LABEL/ $D/list_${v}_LABEL.html
          done
          get $B/mslrem_1001/LABEL/MODRDR6.FMT $D/MODRDR6.FMT
          get $B/mslrem_1001/LABEL/ENVRDR6.FMT $D/ENVRDR6.FMT
          get $B/mslrem_1001/DATA/SOL_00090_00179/SOL00090/ $D/list_sol00090.html
          # newest range folder and its newest sol folder
          LAST=$(grep -oE 'SOL_[0-9]{5}_[0-9]{5}' $D/list_mslrem_1001_DATA.html | sort -u | tail -1)
          echo "last range: $LAST"
          get $B/mslrem_1001/DATA/$LAST/ $D/list_last_range.html
          LASTSOL=$(grep -oE 'SOL[0-9]{5}' $D/list_last_range.html | sort -u | tail -1)
          get $B/mslrem_1001/DATA/$LAST/$LASTSOL/ $D/list_last_sol.html
          # one sample MODRDR table (first 400 lines) + its label
          F=$(grep -oE 'RME_[0-9]+RMD[A-Z0-9_]+\.(TAB|LBL)' $D/list_sol00090.html | sort -u)
          echo "$F" > $D/sol00090_files.txt
          T=$(echo "$F" | grep TAB | head -1); L=$(echo "$F" | grep LBL | head -1)
          [ -n "$L" ] && get $B/mslrem_1001/DATA/SOL_00090_00179/SOL00090/$L $D/sample.LBL
          [ -n "$T" ] && curl -sSL --retry 3 -A "martian-map data pipeline" $B/mslrem_1001/DATA/SOL_00090_00179/SOL00090/$T | head -400 > $D/sample_head.TAB
          [ -n "$T" ] && curl -sSLI -A "martian-map data pipeline" $B/mslrem_1001/DATA/SOL_00090_00179/SOL00090/$T | grep -i content-length > $D/sample_size.txt
          ls -la $D
      - name: Commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pipeline/sources/_probe/rems
          if git commit -m "probe: REMS archive structure"; then
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
