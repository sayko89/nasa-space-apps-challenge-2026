name: Fetch 1 m DTM window

# Downloads the full Mars 2020 TRN HiRISE DTM mosaic (1.8 GB) once, cuts the site window
# at full 1 m resolution and commits it (input for the rock-relief layer).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-dtm
  cancel-in-progress: true

jobs:
  dtm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin >/dev/null
      - name: Download and cut
        run: |
          curl -sSL --retry 3 -o /tmp/dtm.tif \
            https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif
          ls -la /tmp/dtm.tif
          # Source is eqc with lat_ts=0: x = R*lon, y = R*lat (radians). Window = site (2044 m) + 300 m margin,
          # widened east-west by 1/cos(lat) because the source projection stretches it.
          read X0 Y0 X1 Y1 <<< $(python3 -c "import math;R=3396190;la,lo=18.44,77.45;h=1172;k=1/math.cos(math.radians(la));x=R*math.radians(lo);y=R*math.radians(la);print(x-h*k,y+h,x+h*k,y-h)")
          mkdir -p pipeline/sources/hirise pipeline/sources/_probe
          gdal_translate -q -projwin $X0 $Y0 $X1 $Y1 -co COMPRESS=DEFLATE -co PREDICTOR=3 -co TILED=YES -co ZLEVEL=9 \
            /tmp/dtm.tif pipeline/sources/hirise/jezero_dtm_1m_window.tif
          gdalinfo -stats pipeline/sources/hirise/jezero_dtm_1m_window.tif > pipeline/sources/_probe/dtm_window.gdalinfo.txt
          rm -f pipeline/sources/hirise/*.aux.xml
          ls -la pipeline/sources/hirise
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pipeline/sources/hirise pipeline/sources/_probe/dtm_window.gdalinfo.txt
          if git commit -m "data: 1 m HiRISE DTM window for the rock-relief layer"; then
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
