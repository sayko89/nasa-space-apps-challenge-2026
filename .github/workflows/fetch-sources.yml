name: Fetch source data

# Downloads the raw layer sources (Zenodo, NASA) and commits them, because the
# processing scripts are run where these hosts are not reachable.
# Run by hand (Actions → Fetch source data → Run workflow) when a source changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_sources.py 2>&1 | tee fetch.log
      - run: mkdir -p pipeline/sources/_probe && cp fetch.log pipeline/sources/_probe/fetch.log
        if: always()
      - name: Describe the rasters and the CRISM legend
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin poppler-utils >/dev/null
          mkdir -p pipeline/sources/_probe
          gdalinfo -stats pipeline/sources/themis_ti/Jezero_Thermal_Inertia_v1.tiff > pipeline/sources/_probe/themis_ti.gdalinfo.txt 2>&1 || true
          gdalinfo -stats pipeline/sources/crism/jezeroFinal.tif > pipeline/sources/_probe/crism.gdalinfo.txt 2>&1 || true
          pdftotext -layout pipeline/sources/crism/Jezero_readme.pdf pipeline/sources/_probe/crism_readme.txt || true
          pdftoppm -png -r 60 pipeline/sources/crism/Jezero_readme.pdf pipeline/sources/_probe/crism_readme || true
          curl -sL https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE/ > pipeline/sources/_probe/trn_hirise_listing.html || true
          curl -sL https://planetarymaps.usgs.gov/mosaic/mars2020_trn/ > pipeline/sources/_probe/trn_listing.html || true
      - name: Perseverance panoramas inside the site
        if: always()
        run: |
          pip install -q pillow
          python pipeline/build_pov.py 2>&1 | tail -25 >> pipeline/sources/_probe/fetch.log

      - name: Commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pipeline/sources web/public/sites
          if git commit -m "data: fetch layer sources"; then git pull --rebase && git push; fi
