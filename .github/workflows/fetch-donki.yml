name: Fetch space weather (NASA DONKI)

# DONKI solar particle events, CMEs modelled to reach Mars and X-class flares since
# Curiosity landed (2012-08-06) → web/public/sites/<site>/space_weather.json, the app's
# fallback when the live DONKI lookup fails (offline package, rate limit). Runs when this
# file or the scripts change, every Monday, or by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - .github/workflows/fetch-donki.yml
      - pipeline/fetch_donki.py
      - pipeline/build_space_weather.py

permissions:
  contents: write

concurrency:
  group: fetch-donki
  cancel-in-progress: false

jobs:
  donki:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe DONKI hosts
        run: |
          for u in "https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/SEP?startDate=2024-05-01&endDate=2024-05-31" \
                   "https://api.nasa.gov/DONKI/SEP?startDate=2024-05-01&endDate=2024-05-31&api_key=DEMO_KEY"; do
            curl -sS -m 60 -o /tmp/p.json -w "%{http_code} %{time_total}s %{size_download}B  $u\n" "$u" || echo "FAILED $u"
            head -c 200 /tmp/p.json; echo
          done
      - run: |
          mkdir -p pipeline/sources/_probe
          python -u pipeline/fetch_donki.py 2>&1 | tee pipeline/sources/_probe/donki_fetch.log
          python pipeline/build_space_weather.py --site jezero
          python pipeline/build_space_weather.py --site gale
      - name: Commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A web/public/sites pipeline/sources/_probe/donki_fetch.log
          if git commit -m "data: DONKI space-weather archive since 2012 (both sites)"; then
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
