name: Fetch source data (6)

# Downloads the raw layer sources (Zenodo, NASA) and commits them, because the
# processing scripts are run where these hosts are not reachable.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-sources-6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sources-6
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_sources.py 2>&1 | tee fetch.log
      - run: mkdir -p pipeline/sources/_probe && cp fetch.log pipeline/sources/_probe/fetch.log
        if: always()
      - name: Describe the rasters and the CRISM legend
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin poppler-utils >/dev/null
          mkdir -p pipeline/sources/_probe
          gdalinfo -stats pipeline/sources/themis_ti/Jezero_Thermal_Inertia_v1.tiff > pipeline/sources/_probe/themis_ti.gdalinfo.txt 2>&1 || true
          gdalinfo -stats pipeline/sources/crism/jezeroFinal.tif > pipeline/sources/_probe/crism.gdalinfo.txt 2>&1 || true
          pdftotext -layout pipeline/sources/crism/Jezero_readme.pdf pipeline/sources/_probe/crism_readme.txt || true
          pdftoppm -png -r 60 pipeline/sources/crism/Jezero_readme.pdf pipeline/sources/_probe/crism_readme || true
          curl -sL https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE/ > pipeline/sources/_probe/trn_hirise_listing.html || true
          curl -sL https://planetarymaps.usgs.gov/mosaic/mars2020_trn/ > pipeline/sources/_probe/trn_listing.html || true
      - name: DONKI over IPv4 (CCMC host is unreachable over IPv6 from the runners)
        if: always()
        run: |
          mkdir -p pipeline/sources/donki/raw
          for k in SEP CME FLR; do
            curl -4 -sS --max-time 300 --retry 3 -o pipeline/sources/donki/raw/$k.json \
              "https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/$k?startDate=2021-02-18&endDate=$(date -u +%F)" \
              && echo "DONKI $k: $(python3 -c "import json;print(len(json.load(open('pipeline/sources/donki/raw/$k.json'))))") events (curl -4)" >> pipeline/sources/_probe/fetch.log \
              || echo "DONKI $k curl -4 failed" >> pipeline/sources/_probe/fetch.log
          done
          python3 - <<'PY'
          import json, pathlib
          d = pathlib.Path('pipeline/sources/donki')
          ev = json.loads((d / 'events.json').read_text()) if (d / 'events.json').exists() else {}
          for k in ['SEP', 'CME', 'FLR']:
              f = d / 'raw' / f'{k}.json'
              try:
                  data = json.loads(f.read_text() or '[]')
              except Exception:
                  continue
              if isinstance(data, list) and len(data) > len(ev.get(k) or []):
                  ev[k] = data
          (d / 'events.json').write_text(json.dumps(ev))
          print({k: len(v) for k, v in ev.items()})
          PY
          rm -rf pipeline/sources/donki/raw

      - name: Commit sources
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pipeline/sources
          if git commit -m "data: fetch layer sources"; then for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done; fi

      - name: Perseverance panoramas inside the site
        if: always()
        run: |
          python pipeline/build_pov.py 2>&1 | tail -40 >> pipeline/sources/_probe/fetch.log

      - name: Commit
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pipeline/sources artifacts/moon-rover/public/sites
          if git commit -m "data: Perseverance panoramas"; then for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done; fi
